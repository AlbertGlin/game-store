<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подписка - GameZone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-inner">
            <div class="logo">🎮 GameZone</div>
            <nav>
                <a href="index.html">Главная</a>
                <a href="games.html">Игры</a>
                <a href="top.html">Топ-10</a>
                <a href="reviews.html">Отзывы</a>
                <a href="subscribe.html">Подписка</a>
            </nav>
        </div>
    </header>

    <section class="page-header">
        <h1>📫 Подписка</h1>
        <p>Узнавай первым о новинках и скидках</p>
    </section>

    <section class="subscribe-section">
        <div class="subscribe-form-box">
            <form class="subscribe-form">
                <label>Ваше имя</label>
                <input type="text" placeholder="Альберт" required>

                <label>Email</label>
                <input type="email" placeholder="you@example.com" required>

                <label>Любимый жанр</label>
                <select>
                    <option>Шутеры</option>
                    <option>RPG</option>
                    <option>Хорроры</option>
                    <option>Гонки</option>
                    <option>Стратегии</option>
                </select>

                <label class="checkbox">
                    <input type="checkbox">
                    <span>Хочу получать новости о скидках</span>
                </label>

                <button type="submit">Подписаться</button>
            </form>
        </div>
    </section>

    <footer>
        <p>2025 GameZone. Все права защищены.</p>
    </footer>

</body>
</html>
